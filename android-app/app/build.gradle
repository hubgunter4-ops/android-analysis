plugins { id 'com.android.application' }

android {
    namespace 'com.zapia.devicecrypt'
    compileSdk 35
    defaultConfig {
        applicationId 'com.zapia.devicecrypt'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Sin dependencias: solo APIs públicas del SDK (Keystore, SAF, DevicePolicyManager).
dependencies {
}
