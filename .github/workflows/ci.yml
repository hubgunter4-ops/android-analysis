name: CI · tests and Debian package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Tests and GUI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-tk xvfb shellcheck

      - name: Validate Python and shell syntax
        run: |
          python -m py_compile src/no4nn_gui.py src/ui/*.py
          bash -n install.sh src/no4nn.sh src/android_toolchain/core.sh
          shellcheck -x install.sh src/no4nn.sh src/android_toolchain/core.sh

      - name: Run regression tests
        run: bash tests/test_installer.sh

      - name: Run modular GUI smoke test
        run: |
          xvfb-run -a python - <<'PY'
          from pathlib import Path
          from src.no4nn_gui import ToolchainGUI

          app = ToolchainGUI(Path.cwd())
          app.update_idletasks()
          app.update()
          assert app.notebook.index("end") == 2
          app.show_diagnostics()
          app.update()
          assert "Diagnóstico" in app.status.get()
          assert app.installer_view.output.get("1.0", "end").strip()
          app.destroy()
          print("GUI smoke test: OK")
          PY

  dependency-lock:
    name: Verify locked Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate lockfile without installing packages
        run: |
          test -s requirements.lock
          grep -q '^setuptools==' requirements.lock
          grep -q -- '--hash=sha256:' requirements.lock
          python -m pip install --dry-run --ignore-installed --require-hashes --requirement requirements.lock

  package:
    name: Build Debian package
    needs: [test, dependency-lock]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dpkg-dev lintian

      - name: Build package
        run: ./packaging/build-deb.sh

      - name: Verify package contents and metadata
        run: |
          dpkg-deb --info android-analysis-toolchain_2.1.0_all.deb
          dpkg-deb --contents android-analysis-toolchain_2.1.0_all.deb
          dpkg-deb --contents android-analysis-toolchain_2.1.0_all.deb | grep -q 'usr/share/android-analysis/src/ui/diagnostics.py'
          dpkg-deb --contents android-analysis-toolchain_2.1.0_all.deb | grep -q 'usr/share/android-analysis/requirements.lock'
          dpkg-deb --contents android-analysis-toolchain_2.1.0_all.deb | grep -q -- '-rw-r--r--.*requirements.lock'
          lintian --fail-on error android-analysis-toolchain_2.1.0_all.deb

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-analysis-toolchain-${{ github.sha }}
          path: android-analysis-toolchain_2.1.0_all.deb
          if-no-files-found: error
          retention-days: 14
